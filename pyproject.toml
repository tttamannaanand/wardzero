[project]
name = "wardzero"
version = "0.1.0"
description = "Ransomware outbreak simulator for a hospital network"
requires-python = ">=3.11"
license = "MIT"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
